services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://wager:wager@postgres:5432/wagering
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_NAME: wager-transactions.fifo
      SQS_DLQ_NAME: wager-transactions-dlq.fifo
      SQS_CONSUMER_ENABLED: "true"
      OUTBOX_WORKER_ENABLED: "true"
      PENDING_REF_WORKER_ENABLED: "true"
      PORT: "3000"
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    deploy:
      replicas: 1

  api2:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://wager:wager@postgres:5432/wagering
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_NAME: wager-transactions.fifo
      SQS_DLQ_NAME: wager-transactions-dlq.fifo
      SQS_CONSUMER_ENABLED: "true"
      OUTBOX_WORKER_ENABLED: "true"
      PENDING_REF_WORKER_ENABLED: "true"
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    profiles: ["multi"]

  api3:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://wager:wager@postgres:5432/wagering
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_NAME: wager-transactions.fifo
      SQS_DLQ_NAME: wager-transactions-dlq.fifo
      SQS_CONSUMER_ENABLED: "true"
      OUTBOX_WORKER_ENABLED: "true"
      PENDING_REF_WORKER_ENABLED: "true"
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    profiles: ["multi"]

volumes:
  pgdata:
